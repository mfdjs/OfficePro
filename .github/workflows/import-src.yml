name: import-src
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-src
  cancel-in-progress: true
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch archive
        run: |
          curl -fsSL --retry 6 --retry-all-errors --connect-timeout 20 \
            -o /tmp/src.tar.gz \
            "https://lucia-grace-feedback-handle.trycloudflare.com/officepro-src.tar.gz"
      - name: Verify checksum
        run: |
          echo "bb72f87b3c4eb44d73c357869c0b36046eef5cac10b3c2c6b7d53fd5b981e1b5  /tmp/src.tar.gz" | sha256sum -c -
      - name: Extract
        run: tar -xzf /tmp/src.tar.gz -C "$GITHUB_WORKSPACE"
      - name: Remove relay scaffolding
        run: |
          git rm -r --ignore-unmatch .payload
          git rm --ignore-unmatch scripts/unpack-payload.mjs
          git rm --ignore-unmatch .github/workflows/unpack.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Import canonical source tree (25 files)"
            git push
          fi
