name: Unpack Payload

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unpack-payload
  cancel-in-progress: true

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unpack payload
        id: unpack
        run: |
          OUT=$(node scripts/unpack-payload.mjs)
          echo "$OUT"
          if echo "$OUT" | grep -q "^OK:"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit unpacked files
        if: steps.unpack.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .payload
          git add -A
          git commit -m "Unpack source files from payload"
          git push
